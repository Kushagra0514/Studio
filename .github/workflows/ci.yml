name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install locked Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify Python dependencies
        run: python -m pip check

      - name: Lint Python
        run: python -m ruff check backend scripts evals tests

      - name: Check Python formatting
        run: python -m ruff format --check backend scripts evals tests

      - name: Test backend
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20.20.2"
          package-manager-cache: false

      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Create non-secret Compose environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build container images
        run: docker compose build
